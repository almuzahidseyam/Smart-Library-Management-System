name: Verify local accounts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python build.py --ui
      - if: runner.os == 'Windows'
        run: python build.py --ui
